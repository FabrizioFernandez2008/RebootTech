<div class="busqueda-cliente">

  <div class="campo-dni">
    <label for="dniCliente" class="form-label">DNI del cliente</label>

    <input
      id="dniCliente"
      type="text"
      class="form-control"
      maxlength="8"
      inputmode="numeric"
      placeholder="Ingrese los 8 dígitos"
      [ngModel]="dni()"
      (ngModelChange)="dni.set($event.replace(/[^0-9]/g, '').slice(0, 8)); mostrarErrorDni = false"
      (keydown)="validarTeclaDni($event)"
      (keyup.enter)="buscarCliente()">

    @if (mostrarErrorDni) {
      <small class="text-danger">Solo se permiten números.</small>
    }
    </div>

  <button
    type="button"
    class="btn btn-primary"
    (click)="buscarCliente()">
    <i class="bi bi-search"></i>
    Buscar cliente
  </button>

</div>
