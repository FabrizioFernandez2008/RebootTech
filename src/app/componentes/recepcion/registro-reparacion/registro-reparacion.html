<section class="registro-reparacion">

  <div class="seccion-encabezado">
    <h2>2. Datos del equipo y servicio</h2>
    <p>Ingresa la información del equipo y describe el problema reportado por el cliente.</p>
  </div>

  <div class="row">

    <div class="col-md-4 mb-3">
      <label class="form-label">Tipo de equipo *</label>
      <select
        class="form-select"
        [ngModel]="tipoEquipo()"
        (ngModelChange)="tipoEquipo.set($event)">
        <option value="">Seleccione un equipo</option>
        <option value="Laptop">Laptop</option>
        <option value="Computadora de escritorio">Computadora de escritorio</option>
        <option value="Monitor">Monitor</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <div class="col-md-4 mb-3">
      <label class="form-label">Marca *</label>
      <input
        type="text"
        class="form-control"
        placeholder="Ej. Lenovo"
        [ngModel]="marca()"
        (ngModelChange)="marca.set($event)">
    </div>

    <div class="col-md-4 mb-3">
      <label class="form-label">Modelo *</label>
      <input
        type="text"
        class="form-control"
        placeholder="Ej. IdeaPad 3"
        [ngModel]="modelo()"
        (ngModelChange)="modelo.set($event)">
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">Número de serie</label>
      <input
        type="text"
        class="form-control"
        placeholder="Ingrese el número de serie"
        [ngModel]="numeroSerie()"
        (ngModelChange)="numeroSerie.set($event)">
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">Accesorios entregados</label>
      <input
        type="text"
        class="form-control"
        placeholder="Ej. Cargador, mouse, funda"
        [ngModel]="accesorios()"
        (ngModelChange)="accesorios.set($event)">
    </div>

    <div class="col-12 mb-3">
      <label class="form-label">Problema reportado *</label>
      <textarea
        class="form-control"
        rows="3"
        placeholder="Describe el problema indicado por el cliente"
        [ngModel]="problemaReportado()"
        (ngModelChange)="problemaReportado.set($event)">
      </textarea>
    </div>

    <div class="col-12 mb-3">
      <label class="form-label">Observaciones</label>
      <textarea
        class="form-control"
        rows="2"
        placeholder="Información adicional sobre el equipo"
        [ngModel]="observaciones()"
        (ngModelChange)="observaciones.set($event)">
      </textarea>
    </div>

  </div>

  <div class="d-flex justify-content-end mt-3">
    <button
      type="button"
      class="btn btn-primary"
      [disabled]="
        !tipoEquipo().trim() ||
        !marca().trim() ||
        !modelo().trim() ||
        !problemaReportado().trim()
      "
      (click)="registrarReparacion()">
      <i class="bi bi-save"></i>
      Registrar pedido
    </button>
  </div>

</section>
