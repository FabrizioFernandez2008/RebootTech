<section class="resumen">
  <div class="encabezado-resumen">
    <div>
      <h1>Panel de administración</h1>
      <p>Resumen general de las solicitudes de servicio.</p>
    </div>

    <div class="filtro-periodo">
      <label for="periodo" class="form-label">Periodo:</label>
      <select
        id="periodo"
        class="form-select"
        [ngModel]="periodoSeleccionado()"
        (ngModelChange)="periodoSeleccionado.set($event)">
        <option value="hoy">Hoy</option>
        <option value="semana">Esta semana</option>
        <option value="mes">Este mes</option>
        <option value="anio">Este año</option>
        <option value="personalizado">Personalizado</option>
      </select>
    </div>
  </div>

  @if (mostrarFechas()) {
    <div class="filtro-fechas">
      <div>
        <label for="fechaInicio" class="form-label">Fecha de inicio</label>
        <input
          id="fechaInicio"
          type="date"
          class="form-control"
          [ngModel]="fechaInicio()"
          (ngModelChange)="fechaInicio.set($event)"
          [max]="fechaFin() || null">
      </div>

      <div>
        <label for="fechaFin" class="form-label">Fecha de fin</label>
        <input
          id="fechaFin"
          type="date"
          class="form-control"
          [ngModel]="fechaFin()"
          (ngModelChange)="fechaFin.set($event)"
          [min]="fechaInicio() || null">
      </div>
    </div>
  }

  <div class="row g-3 tarjetas-resumen">
    <div class="col-md-4">
      <article class="tarjeta">
        <div class="icono icono-registradas">
          <i class="bi bi-clipboard-data"></i>
        </div>
        <div>
          <p>Solicitudes registradas</p>
          <h2>{{ solicitudesRegistradas() }}</h2>
        </div>
      </article>
    </div>

    <div class="col-md-4">
      <article class="tarjeta">
        <div class="icono icono-completadas">
          <i class="bi bi-check-circle"></i>
        </div>
        <div>
          <p>Solicitudes completadas</p>
          <h2>{{ solicitudesCompletadas() }}</h2>
        </div>
      </article>
    </div>

    <div class="col-md-4">
      <article class="tarjeta">
        <div class="icono icono-espera">
          <i class="bi bi-hourglass-split"></i>
        </div>
        <div>
          <p>Solicitudes en espera</p>
          <h2>{{ solicitudesEnEspera() }}</h2>
        </div>
      </article>
    </div>
  </div>
</section>
